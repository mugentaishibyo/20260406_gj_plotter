<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>YMM Plotter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Video Preview -->
      <section class="video-container" id="video-ui">
        <video id="video-preview" playsinline></video>
        <div class="video-overlay" id="video-overlay">
          <label for="video-file" class="file-input-label">参照動画を選択</label>
          <input type="file" id="video-file" accept="video/*" hidden>
        </div>
      </section>

      <!-- Timeline -->
      <section class="timeline-section">
        <div class="timeline-header">
          <span id="current-time-display">00:00:00.000</span>
        </div>
        <div class="timeline-container" id="timeline-container">
          <div class="timeline-content" id="timeline-content">
            <div class="timeline-playhead" id="playhead"></div>
            <!-- Subtitle items will be injected here -->
          </div>
        </div>
      </section>

      <!-- Input and Controls -->
      <section class="input-section">
        <div class="char-selector" id="char-selector">
          <!-- Character buttons will be injected here -->
        </div>

        <div class="input-row">
          <input type="text" id="text-input" placeholder="セリフを入力..." autocomplete="off">
          <button id="add-btn">追加</button>
        </div>

        <div class="export-section">
          <button class="export-btn" id="export-timeline">CSV: タイムライン設計</button>
          <button class="export-btn" id="export-script">CSV: 台本・音声合成用</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
